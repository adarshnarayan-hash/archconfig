# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

source = ~/.config/hypr/hyprland/monitors.conf     # 1. monitors first
source = ~/.config/hypr/hyprland/environment.conf   # 2. env vars (needed by autostart)
source = ~/.config/hypr/hyprland/program.conf       # 3. $terminal/$menu vars (needed by keybinds)
source = ~/.config/hypr/hyprland/autostart.conf     # 4. exec-once (uses env + program vars)
source = ~/.config/hypr/hyprland/look.conf          # 5. appearance
source = ~/.config/hypr/hyprland/input.conf         # 6. input
source = ~/.config/hypr/hyprland/workspaces.conf    # 7. workspace rules (after monitors)
source = ~/.config/hypr/hyprland/keybind.conf       # 8. keybinds (uses $mainMod + program vars)
source = ~/.config/hypr/hyprland/theme_dark.conf      # 9. gestures (after input + keybinds)

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wikbackground: transparent;i


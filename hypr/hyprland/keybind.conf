###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
#SUPER_SHIFT = $mainMod SHIFT
#SUPER_ALT = $mainMod ALT

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, exec, fullscreentoggle
bind = $SUPER_SHIFT, F, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, V, layoutmsg, togglesplit# dwindle
bind = $mainMod, B, exec, $browser
bind = $mainMod, C, exec, $editor
bind = $mainMod, N, exec, $notion

# Rofi (grave - `)
bind = $mainMod, space, exec, $menu
bind = $mainMod, A, exec, $ROFI "rofi -show-icons -show drun -modi run,drun,filebrowser -theme-str 'listview {columns: 2;}'"
bind = ALT, grave, exec, $ROFI "rofi -show-icons -show window -modi window -theme-str 'window {width: 600px;} listview {columns: 1;}'"
# bind = , XF86PowerOff, exec, $ROFI $HOME/.config/rofi/scripts/power-menu # no need can do with clikcing above ( may create problem later , as have to change the systemd logind.conf to ignore power key and handle it with rofi , which may cause problem if rofi is not running )
bind = $mainMod, J, exec, $ROFI "rofi -theme-str 'configuration {show-icons: false;} window {width: 250px;} listview {columns: 1;} element-text {vertical-align: 0.50; horizontal-align: 0.50;} inputbar {enabled: false;}' -modes out:$HOME/.config/rofi/scripts/sound-output-port.sh,in:$HOME/.config/rofi/scripts/sound-input-port.sh -show out"
bind = $mainMod SHIFT, J, exec, $ROFI "rofi -theme-str 'configuration {show-icons: false;} window {width: 600px;} listview {columns: 1;} element-text {vertical-align: 0.50; horizontal-align: 0.50;} inputbar {enabled: false;}' -modes outs:$HOME/.config/rofi/scripts/sound-output,ins:$HOME/.config/rofi/scripts/sound-input -show outs"
bind = $mainMod SHIFT, V, exec, $ROFI "rofi -modi Clipboard:~/.config/rofi/scripts/cliphist-rofi-img -show Clipboard -show-icons -theme-str 'window {width: 600px;} listview {columns: 1;}'"

bind = , PRINT, exec, hyprshot -m window
bind = shift, PRINT, exec, hyprshot -m region
bind = $SUPER_SHIFT, Q, exec, hyprlock

#Monitor
bind = $mainMod, F1, focusmonitor, mon:HDMI-A-1
bind = $mainMod, F2, focusmonitor, mon:eDP-1
# bind = $mainMod SHIFT, F1, movecurrentworkspacetomonitor, mon:HDMI-A-1
# bind = $mainMod SHIFT, F2, movecurrentworkspacetomonitor, mon:eDP-1
bind = $mainMod CTRL ALT, up, movewindow, mon:HDMI-A-1
bind = $mainMod CTRL ALT, down, movewindow, mon:eDP-1


# Move focus with mainMod + vim
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move focus with mainMod + Arrow Keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows with mainMod + Shift + Arrow Keys
bind = $SUPER_SHIFT, left, movewindow, l
bind = $SUPER_SHIFT, right, movewindow, r
bind = $SUPER_SHIFT, up, movewindow, u
bind = $SUPER_SHIFT, down, movewindow, d

# Move windows with mainMod + Shift + H J K L (Vim style)
bind = $SUPER_SHIFT, h, movewindow, l
bind = $SUPER_SHIFT, j, movewindow, d
bind = $SUPER_SHIFT, k, movewindow, u
bind = $SUPER_SHIFT, l, movewindow, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $SUPER_SHIFT, 1, movetoworkspace, 1
bind = $SUPER_SHIFT, 2, movetoworkspace, 2
bind = $SUPER_SHIFT, 3, movetoworkspace, 3
bind = $SUPER_SHIFT, 4, movetoworkspace, 4
bind = $SUPER_SHIFT, 5, movetoworkspace, 5
bind = $SUPER_SHIFT, 6, movetoworkspace, 6
bind = $SUPER_SHIFT, 7, movetoworkspace, 7
bind = $SUPER_SHIFT, 8, movetoworkspace, 8
bind = $SUPER_SHIFT, 9, movetoworkspace, 9
bind = $SUPER_SHIFT, 0, movetoworkspace, 10

# Move active window to a workspace silently ( SUPER_ALT = $mainmod ALT)
bind = $SUPER_ALT, 1, movetoworkspacesilent, 1
bind = $SUPER_ALT, 2, movetoworkspacesilent, 2
bind = $SUPER_ALT, 3, movetoworkspacesilent, 3
bind = $SUPER_ALT, 4, movetoworkspacesilent, 4
bind = $SUPER_ALT, 5, movetoworkspacesilent, 5
bind = $SUPER_ALT, 6, movetoworkspacesilent, 6
bind = $SUPER_ALT, 7, movetoworkspacesilent, 7
bind = $SUPER_ALT, 8, movetoworkspacesilent, 8
bind = $SUPER_ALT, 9, movetoworkspacesilent, 9
bind = $SUPER_ALT, 0, movetoworkspacesilent, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod CTRL, S, togglespecialworkspace, magic2
bind = $mainMod CTRL SHIFT, S, movetoworkspace, special:magic2

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#Grouping and ungrouping windows with mainMod + G
bind = $mainMod, G, togglegroup
bind = $mainMod SHIFT, G, moveoutofgroup
bind = $mainMod ALT, TAB, changegroupactive, f
bind = $mainMod ALT SHIFT, TAB, changegroupactive, b

# Laptop multimedia keys for volume and LCD brightness
# swayosd-client is primary; falls back to wpctl/brightnessctl if not running
bindel = ,XF86AudioRaiseVolume,  exec, swayosd-client --output-volume raise      || wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume,  exec, swayosd-client --output-volume lower      || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute,         exec, swayosd-client --output-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute,      exec, swayosd-client --input-volume mute-toggle  || wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp,   exec, swayosd-client --brightness raise          || brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower          || brightnessctl -e4 -n2 set 5%-

# Keyboard backlight (fn + space)
# bindel = ,XF86KbdBrightnessUp,   exec, swayosd-client --keyboard-brightness raise || brightnessctl -d 'tpacpi::kbd_backlight' set 10%+
# bindel = ,XF86KbdBrightnessDown, exec, swayosd-client --keyboard-brightness lower || brightnessctl -d 'tpacpi::kbd_backlight' set 10%-
bindel = ,XF86KbdBrightnessUp,   exec, brightnessctl -d 'tpacpi::kbd_backlight' set 10%+
bindel = ,XF86KbdBrightnessDown, exec, brightnessctl -d 'tpacpi::kbd_backlight' set 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous